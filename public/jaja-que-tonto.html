<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="imagenes/luna-menguante.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">

  <script src="js/theme-init.js"></script>

<body data-page="jaja-que-tonto" data-nav="oculta">
  <main id="top">
    <section class="page-section">
      <h1 class="section-title">jaja, que tonto</h1>
      <p class="section-text">Has caído. Si quieres volver a Inicio, resuelve los acertijos.</p>

      <div class="panel">
        <p class="riddle-progress" id="riddle-progress"></p>
        <p class="riddle-question" id="riddle-question"></p>

        <form class="form" id="riddle-form">
          <label class="field">
            Tu respuesta
            <input id="riddle-answer" autocomplete="off" required>
          </label>
          <div class="form-actions">
            <button class="button-link" type="submit">Responder</button>
            <button class="button-link" type="button" id="riddle-hint">Pista</button>
          </div>
        </form>

        <p class="riddle-feedback" id="riddle-feedback" role="status"></p>

        <div id="riddle-exit" hidden>
          <p class="section-text">Vale, has escapado. Por esta vez.</p>
          <a class="button-link" href="index.html">Volver a Inicio</a>
        </div>
      </div>
    </section>
  </main>
