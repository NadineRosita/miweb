<!DOCTYPE html>

<body data-page="juegos">
  <main id="top">
    <section class="page-section">
      <h1 class="section-title" data-i18n="nav.juegos">Juegos</h1>
      <p class="section-text" data-i18n="games.intro">Pequeños proyectos para jugar un rato.</p>

      <!-- Cada juego es una tarjeta que lleva a su propia página -->
      <div class="card-grid">
        <a class="card game-card" href="ajedrez.html">
          <svg class="game-icon" viewBox="0 0 45 45" aria-hidden="true">
            <circle cx="22.500" cy="13" r="5.500" />
            <path d="M17 19.500h11v2.500H17z" />
            <path d="M19 22c0 5-2 8-5 12.500h17c-3-4.500-5-7.500-5-12.500z" />
            <path d="M11 39.500h23v-3a2 2 0 0 0-2-2H13a2 2 0 0 0-2 2z" />
          </svg>
          <h2 class="card-title" data-i18n="chess.title">Ajedrez</h2>
          <p class="card-text" data-i18n="games.chess">Contra la máquina o contra quien quieras, con un código de sala.</p>
          <span class="card-link" data-i18n="games.play">Jugar →</span>
        </a>
        <a class="card game-card" href="ciudadelas.html">
          <svg class="game-icon" viewBox="0 0 45 45" aria-hidden="true">
            <path d="M6 38V14h5v4h4v-4h5v4h5v-4h5v4h4v-4h5v24z" />
            <path d="M19 38v-9a3.500 3.500 0 0 1 7 0v9z" fill="none" stroke="currentColor" stroke-width="0" />
          </svg>
          <h2 class="card-title" data-i18n="cd.title">Ciudadelas</h2>
          <p class="card-text" data-i18n="games.ciudadelas">Cartas y estrategia para 2 a 7 jugadores, con bots y un tutorial.</p>
          <span class="card-link" data-i18n="games.play">Jugar →</span>
        </a>
      </div>
    </section>
