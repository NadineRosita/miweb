<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pet — NadineRoss</title>
  <link rel="icon" href="imagenes/luna-menguante.svg" type="image/svg+xml">

  <script src="js/theme-init.js"></script>
  <script src="js/i18n.js"></script>
  <link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/noche.css">
  <link rel="stylesheet" href="css/mi-pet.css">
  <script src="js/layout.js" defer></script>
  <script src="js/mi-pet.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body data-page="mi-pet">
  <main id="top">
    <section class="page-section" id="pet-section">
      <h1 class="section-title" data-i18n="nav.mi-pet">Mi Pet</h1>

      <!-- Acceso -->
      <div class="panel" id="pet-auth" hidden>
        <p class="section-text" data-i18n="pet.signIn">Entra en tu cuenta para cuidar de tu mascota. Tu progreso se guarda solo.</p>

        <form class="form" id="auth-form">
          <label class="field">
            <span data-i18n="pet.username">Usuario</span>
            <input name="username" autocomplete="username" required minlength="3" maxlength="24">
          </label>
          <label class="field">
            <span data-i18n="pet.password">Contraseña</span>
            <input name="password" type="password" autocomplete="current-password" required minlength="8">
          </label>
          <div class="form-actions">
            <button class="button-link" type="submit" value="login" data-i18n="pet.login">Entrar</button>
            <button class="button-link" type="submit" value="register" data-i18n="pet.register">Crear cuenta</button>
          </div>
          <p class="form-error" id="auth-error" role="alert"></p>
        </form>
      </div>

      <!-- Juego: lo monta public/js/mi-pet/juego.js al iniciar sesión -->
      <div id="pet-game" hidden></div>
    </section>
  </main>
</body>
</html>
