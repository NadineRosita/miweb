<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pet — NadineRoss</title>
  <link rel="icon" href="imagenes/luna-menguante.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">

  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/layout.js" defer></script>
  <script src="js/mi-pet.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body data-page="mi-pet">
  <main id="top">
    <section class="page-section">
      <h1 class="section-title">Mi Pet</h1>

      <!-- Acceso -->
      <div class="panel" id="pet-auth" hidden>
        <p class="section-text">Entra en tu cuenta para cuidar de tu mascota. Tu progreso se guarda solo.</p>

        <form class="form" id="auth-form">
          <label class="field">
            Usuario
            <input name="username" autocomplete="username" required minlength="3" maxlength="24">
          </label>
          <label class="field">
            Contraseña
            <input name="password" type="password" autocomplete="current-password" required minlength="8">
          </label>
          <div class="form-actions">
            <button class="button-link" type="submit" value="login">Entrar</button>
            <button class="button-link" type="submit" value="register">Crear cuenta</button>
          </div>
          <p class="form-error" id="auth-error" role="alert"></p>
        </form>
      </div>

      <!-- Juego: el futuro Tamagotchi se construye dentro de esta sección -->
      <div class="panel" id="pet-game" hidden>
        <p class="section-text">Hola, <strong id="pet-user"></strong>. Esta es tu mascota:</p>
        <h2 class="card-title" id="pet-name"></h2>

        <div class="stats">
          <label class="stat">Comida <progress id="stat-food" max="100"></progress></label>
          <label class="stat">Felicidad <progress id="stat-happiness" max="100"></progress></label>
          <label class="stat">Energía <progress id="stat-energy" max="100"></progress></label>
        </div>

        <div class="form-actions">
          <button class="button-link" type="button" data-pet-action="feed">Dar de comer</button>
          <button class="button-link" type="button" data-pet-action="play">Jugar</button>
          <button class="button-link" type="button" data-pet-action="sleep">Dormir</button>
          <button class="button-link" type="button" id="logout">Cerrar sesión</button>
        </div>
        <p class="form-error" id="game-error" role="alert"></p>
      </div>
    </section>
  </main>
</body>
</html>
